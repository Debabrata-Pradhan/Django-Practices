<!DOCTYPE html>
{%load static%}

<head>
    <title>
        Second Models Project
    </title>
</head>
<body>
    <h1>
        Employee List
    </h1>
{%if emp_list%}
    <table border="3">
        <thead>
            <th>
                ENO
            </th>
            <th>
                ENAME
            </th>
            <th>
                ESAL
            </th>
            <th>
                EADDR
            </th>
        </thead>
        {%for emp in emp_list%}
        <tr>
            <td>
                {{emp.eno}}
            </td>
            <td>
                {{emp.ename}}
            </td>
            <td>
                {{emp.esal}}
            </td>
            <td>
                {{emp.eaddr}}
            </td>
        </tr>
        {%endfor%}
    </table>
{%else%}
<p>
    No records Found !!!
</p>
{%endif%}
</body>
