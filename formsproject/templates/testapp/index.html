<!DOCTYPE html>
{%load static%}
<head>
    <title>
        Forms Project
    </title>
    <link rel="Stylesheet" href="{% static 'css/index.css' %}">
</head>

<body>
    <h1>Student Input Form</h1>
    <div class="container" align="center">
    {% if Submitted %}
        <h1>Student with name:{{name}} Processed Successfully </h1>
        <h2>
            Enter next student information
        </h2>
    {% else %}
        <h1>Student Input Form</h1>
    {% endif %}
        <form method="post">
            {{form.as_p}}
            {% csrf_token %}
            <input type="submit" value="submit">

        </form>
    </div>
</body>
